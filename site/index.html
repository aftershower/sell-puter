<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sell Put 每日筛选</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <nav class="nav"><a href="./" class="on">每日筛选</a><a href="review.html">复盘</a></nav>
  <h1>Sell Put 每日筛选</h1>
  <div class="sub" id="sub">加载中…</div>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <label>日期 <select id="date"></select></label>
    <label><input type="checkbox" id="hideEarn" checked> 隐藏跨财报合约</label>
    <label>IV ≥ <input type="number" id="minIv" class="num" step="5" min="0">%</label>
    <label>年化 ≥ <input type="number" id="minAnn" class="num" step="5" min="0">%</label>
    <label>|Delta| <input type="number" id="dMin" class="num" step="0.01" min="0" max="1">–<input type="number" id="dMax" class="num" step="0.01" min="0" max="1"></label>
    <label>DTE ≤ <input type="number" id="maxDte" class="num" step="1" min="0"></label>
    <label>一手担保 ≤ $<input type="number" id="maxCol" class="num wide" step="1000" min="0"></label>
    <button id="reset" type="button">恢复默认</button>
    <label>行业 <select id="sector"><option value="">全部</option></select></label>
    <label>来源 <select id="source"><option value="">全部</option><option value="reddit">Reddit 热门</option><option value="screens">Yahoo 榜单</option><option value="core">S&amp;P 500 / 自选</option></select></label>
    <label>AI 风险 <select id="risk"><option value="">全部</option><option>低</option><option>中</option><option>高</option></select></label>
  </div>
  <div id="notice"></div>
  <table class="cards">
    <thead><tr id="head"></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <section id="reddit"></section>
  <footer id="foot"></footer>
</main>
<script>
const COLS = [
  { key: "ticker", label: "股票" },
  { key: "price", label: "现价 / 盘前" },
  { key: "expiry", label: "到期 / DTE" },
  { key: "strike", label: "行权价 / OTM" },
  { key: "delta", label: "Delta" },
  { key: "buffer", label: "缓冲 σ" },
  { key: "mid", label: "估成交价 (bid–ask)" },
  { key: "collateral", label: "一手担保" },
  { key: "annualized", label: "年化" },
  { key: "breakeven", label: "盈亏平衡" },
  { key: "iv", label: "IV / HV20" },
  { key: "earnings", label: "下次财报" },
  { key: "risk", label: "AI 质地 / 风险" },
];
const RISK_ORDER = { "低": 0, "中": 1, "高": 2 };
let report = null, sortKey = "annualized", open = new Set();

const $ = (id) => document.getElementById(id);
const pct = (x, d = 1) => x == null ? "–" : (x * 100).toFixed(d) + "%";
const usd = (x, d = 2) => x == null ? "–" : "$" + Number(x).toFixed(d);
const big = (x) => x == null ? "–" : Math.abs(x) >= 1e12 ? "$" + (x / 1e12).toFixed(2) + "T" : "$" + (x / 1e9).toFixed(1) + "B";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function load(date) {
  const url = date ? `data/history/${date}.json` : "data/latest.json";
  report = await (await fetch(url, { cache: "no-store" })).json();
  open.clear();
  const sectors = [...new Set(report.candidates.map((c) => c.sector).filter(Boolean))].sort();
  $("sector").innerHTML = '<option value="">全部</option>' + sectors.map((s) => `<option>${esc(s)}</option>`).join("");
  render();
}

const FILTER_IDS = ["minIv", "minAnn", "dMin", "dMax", "maxDte", "maxCol"];
const STORE_KEY = "sellputer.filters";

function pageDefaults() {
  const p = report.params.page || {}, o = report.params.options;
  return {
    minIv: Math.round((p.min_iv ?? o.min_iv ?? 0) * 100), minAnn: Math.round((p.min_annualized ?? o.min_annualized) * 100),
    dMin: p.delta_min ?? o.delta_min, dMax: p.delta_max ?? o.delta_max, maxDte: p.max_dte ?? o.max_dte,
    maxCol: p.max_collateral ?? o.max_collateral ?? 1e9, hideEarn: p.hide_earnings ?? true,
  };
}

function readFilters() {
  const f = Object.fromEntries(FILTER_IDS.map((id) => [id, $(id).value === "" ? NaN : +$(id).value]));
  const d = pageDefaults();
  for (const id of FILTER_IDS) if (Number.isNaN(f[id])) f[id] = d[id];
  f.hideEarn = $("hideEarn").checked;
  return f;
}

function setFilters(f) {
  for (const id of FILTER_IDS) $(id).value = f[id];
  $("hideEarn").checked = f.hideEarn;
}

function saveFilters() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(readFilters())); } catch {}
}

function savedFilters() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch { return null; }
}

function visibleRows() {
  const f = readFilters(), sector = $("sector").value, risk = $("risk").value, source = $("source").value;
  const rows = [];
  for (const c of report.candidates) {
    const contracts = c.contracts
      .filter((k) => k.annualized >= f.minAnn / 100 && k.iv >= f.minIv / 100 && -k.delta >= f.dMin && -k.delta <= f.dMax &&
        k.dte <= f.maxDte && k.collateral <= f.maxCol && !(f.hideEarn && k.crosses_earnings))
      .sort((a, b) => b.annualized - a.annualized);
    if (!contracts.length) continue;
    if (sector && c.sector !== sector) continue;
    if (risk && c.ai?.risk_level !== risk) continue;
    if (source === "reddit" && !c.reddit) continue;
    if (source === "screens" && !c.screens?.length) continue;
    if (source === "core" && !c.core) continue;
    rows.push({ c, k: contracts[0], others: contracts.slice(1) });
  }
  const val = ({ c, k }) => ({
    ticker: c.ticker, price: c.gap, expiry: k.dte, strike: k.otm_pct, delta: k.delta, buffer: k.buffer_sd ?? -1, mid: k.premium, collateral: -k.collateral,
    annualized: k.annualized, breakeven: 1 - k.breakeven / c.price, iv: k.iv / c.hv20,
    earnings: c.next_earnings || "9999", risk: RISK_ORDER[c.ai?.risk_level] ?? 9,
  }[sortKey]);
  const asc = ["ticker", "expiry", "earnings", "risk", "delta"].includes(sortKey) ? 1 : -1;
  rows.sort((a, b) => (val(a) > val(b) ? asc : val(a) < val(b) ? -asc : 0));
  return rows;
}

function render() {
  const r = report;
  $("sub").textContent = `数据时间 ${r.generated_at.replace("T", " ")}（美东） · 无风险利率 ${pct(r.risk_free_rate, 2)}` +
    (r.market_open ? " · 盘中实时（约 15 分钟延迟）" : " · 期权报价为上一收盘价（盘前期权不交易），Delta、OTM、权利金已按最新盘前价重新估算");
  $("stats").innerHTML = [
    [r.stats.universe, "扫描股票"], [r.stats.quality_passed, "通过质地筛选"], [r.stats.candidates, "有合格合约"],
    ...(r.stats.reddit_trending ? [[r.stats.reddit_trending, "Reddit 热门"]] : []),
  ].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  const notes = [];
  if (!r.ai.enabled) notes.push("AI 风险笔记未启用（未配置 ANTHROPIC_API_KEY）。");
  if (r.ai.error) notes.push("AI 风险笔记今天生成失败：" + esc(r.ai.error));
  const sp = r.ai.spend;
  $("notice").innerHTML = notes.map((n) => `<div class="notice">${n}</div>`).join("");

  $("head").innerHTML = COLS.map((c) => `<th data-k="${c.key}" class="${c.key === sortKey ? "sorted" : ""}">${c.label}</th>`).join("");
  const rows = visibleRows();
  if (!rows.length) {
    $("body").innerHTML = `<tr><td colspan="${COLS.length}" class="empty">当前条件下没有合约</td></tr>`;
  } else {
    $("body").innerHTML = rows.map(rowHtml).join("");
  }
  $("reddit").innerHTML = redditHtml(r.reddit || []);
  const o = r.params.options, q = r.params.quality;
  $("foot").innerHTML = `
    后端抓取范围（页面筛选只能在此范围内收紧）：|Delta| ${o.delta_min}–${o.delta_max} · IV ≥ ${pct(o.min_iv ?? 0, 0)} · 年化 ≥ ${pct(o.min_annualized, 0)} · DTE ${o.min_dte}–${o.max_dte} 天 · 一手担保 ≤ $${(o.max_collateral ?? 0).toLocaleString()} · OI ≥ ${o.min_open_interest} · 价差 ≤ ${pct(o.max_spread_pct, 0)}<br>
    质地：S&amp;P 500 成分股和自选名单直接通过；其他来源（Reddit 热门、Yahoo 榜单）要求市值 ≥ ${big(q.min_market_cap)}${q.require_profitable ? " 且在盈利" : ""}；所有股票股价 ≥ $${q.min_price}<br>
    ${sp ? `AI：深度分析 ${sp.deep} 只、简要笔记 ${sp.light} 只、联网搜索 ${sp.searches} 次，今日花费约 $${sp.usd.toFixed(2)}（上限 $${sp.budget_usd}）<br>` : ""}
    估成交价 = 中间价 − ¼ 价差（卖方实际成交通常低于中间价）；年化 = 估成交价 ÷ 行权价 × 365 ÷ DTE（按现金担保计）。缓冲 σ = 行权价离现价有几个"到期前一倍标准差"的波动，越大越不容易被行权。IV 由昨收中间价按 Black-Scholes 反推（未计股息）；盘前股价有变动时，Delta 和权利金（标"盘前估"）按盘前价和同一 IV 重新估算，开盘后实际报价会不同。行权价是固定的，盘前大跌意味着合约离被行权更近。数据来自 Yahoo Finance，可能延迟或有误，下单前请以券商实时报价为准。<br>
    本页面是按上述规则自动筛选的数据和 AI 生成的风险摘要，不构成投资建议。卖出看跌期权在股价大跌时可能被行权并产生较大亏损。`;
}

function priceCell(c) {
  const g = c.gap ?? 0, warn = report.params.options.gap_warn ?? 0.03;
  if (Math.abs(g) < 0.0005) return usd(c.price_now ?? c.price);
  const cls = g <= -warn ? "tag gap-down" : g >= warn ? "tag gap-up" : "small";
  return `${usd(c.price_now)} <span class="${cls}">${g > 0 ? "+" : ""}${pct(g)}</span>`;
}

function earnCell(c, k) {
  const d = (c.earnings_estimated ? "≈" : "") + c.next_earnings.slice(5);
  const tip = c.earnings_estimated ? ' title="公司还没公布下次财报日，按上次财报日 + 75 天保守估算"' : "";
  return k.crosses_earnings ? `<span class="tag earn"${tip}>${d} 跨期</span>` : `<span${tip}>${d}</span>`;
}

const SCREEN_LABEL = { most_actives: "成交最活跃", day_losers: "跌幅榜", day_gainers: "涨幅榜" };

const WHY = {
  candidate: "入选", no_contract: "无合格合约", chain_failed: "数据失败", data_failed: "数据失败", not_equity: "ETF/非个股",
  market_cap: "市值不够", roe: "ROE 低", profit_margin: "净利率低", fcf: "现金流为负", debt: "负债高",
  price: "股价低", sma200: "在200日线下", drawdown: "回撤大", unprofitable: "未盈利",
};

function redditHtml(list) {
  if (!list.length) return "";
  return `<h3>今日 Reddit 热门</h3>
    <div class="small">过去 24 小时 Reddit 股票版块提及最多的股票（数据来自 ApeWisdom），已并入今天的股票池，同样要过质地和期权规则。</div>
    <div class="chips">${list.map((x) => `<span class="chip${x.status === "candidate" ? " in" : ""}">#${x.rank} ${esc(x.ticker)} · ${x.mentions} <span class="why">${WHY[x.status] || esc(x.status)}</span></span>`).join("")}</div>`;
}

function rowHtml({ c, k, others }) {
  const ai = c.ai;
  const cells = [
    `<span class="tk">${esc(c.ticker)}</span>${c.reddit ? `<span class="tag rd">Reddit #${c.reddit.rank}</span>` : ""}${(c.screens || []).map((x) => `<span class="tag rd">${SCREEN_LABEL[x] || esc(x)}</span>`).join("")}<span class="nm">${esc(c.name)} · ${esc(c.sector || "")}</span>`,
    priceCell(c),
    `${k.expiry.slice(5)} <span class="small">${k.dte}天</span>`,
    `${usd(k.strike, k.strike % 1 ? 1 : 0)} <span class="small">${pct(k.otm_pct)}</span>`,
    k.delta.toFixed(2),
    k.buffer_sd == null ? "–" : k.buffer_sd.toFixed(2),
    `${(k.repriced ?? k.premium !== k.mid) ? '<span class="small">盘前估</span> ' : ""}${usd(k.premium)} <span class="small">${k.bid.toFixed(2)}–${k.ask.toFixed(2)}</span>`,
    "$" + k.collateral.toLocaleString(),
    `<span class="ann">${pct(k.annualized)}</span>`,
    usd(k.breakeven),
    `${pct(k.iv, 0)} <span class="small">/ ${pct(c.hv20, 0)}</span>`,
    c.next_earnings ? earnCell(c, k) : k.earnings_unknown ? '<span class="tag earn" title="Yahoo 没有给出下次财报日期，可能在到期前，请自行核对">未知</span>' : "–",
    ai ? `<span class="tag g-${ai.quality_grade}">${ai.quality_grade}</span> <span class="tag r-${ai.risk_level}">${ai.risk_level}</span>` : '<span class="small">–</span>',
  ];
  const tr = `<tr class="row" data-t="${esc(c.ticker)}">${cells.map((v, i) => `<td data-label="${COLS[i].label}"><span>${v}</span></td>`).join("")}</tr>`;
  return open.has(c.ticker) ? tr + detailHtml(c, [k, ...others]) : tr;
}

function detailHtml(c, contracts) {
  const ai = c.ai;
  const chips = [
    ["市值", big(c.market_cap)], ["ROE", pct(c.roe)], ["净利率", pct(c.profit_margin)], ["自由现金流", big(c.fcf)],
    ["负债/权益", c.debt_to_equity == null ? "–" : c.debt_to_equity.toFixed(0) + "%"], ["前瞻PE", c.forward_pe == null ? "–" : c.forward_pe.toFixed(1)],
    ...(c.reddit ? [["Reddit 24h 提及", `${c.reddit.mentions}（前一天 ${c.reddit.mentions_24h_ago ?? "–"}）`]] : []),
    ["52周回撤", pct(c.drawdown_52w)], ["200日线", c.above_sma200 ? "上方" : "下方"], ["HV1年", pct(c.hv252, 0)],
  ].map(([l, v]) => `<span class="chip">${l} ${v}</span>`).join("");
  const aiHtml = ai ? `
      <h4>AI 小结 ${ai.deep ? '<span class="tag rd">深度分析</span>' : '<span class="small">简要</span>'}</h4>
      <p>${esc(ai.summary)}</p>
      <h4>质地 <span class="tag g-${ai.quality_grade}">${ai.quality_grade}</span></h4>
      <p>${esc(ai.quality_view)}</p>
      <h4>到期前风险 <span class="tag r-${ai.risk_level}">${ai.risk_level}</span></h4>
      <ul>${ai.risks.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      ${ai.option_view ? `<h4>期权视角</h4><p>${esc(ai.option_view)}</p>` : ""}
      ${ai.assignment_view ? `<h4>如果被行权</h4><p>${esc(ai.assignment_view)}</p>` : ""}
      ${ai.catalysts?.length ? `<h4>催化剂 / 日程</h4><ul>${ai.catalysts.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      <h4>新闻要点</h4><p>${esc(ai.news_digest)}</p>
      ${ai.sentiment ? `<h4>市场情绪</h4><p>${esc(ai.sentiment)}</p>` : ""}
      ${ai.sources?.length ? `<h4>来源</h4><ul class="src">${ai.sources.map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a></li>`).join("")}</ul>` : ""}`
    : `<p class="small">${report.ai.enabled ? `AI 每天最多分析 ${report.ai.top_n} 只（优先符合默认条件的），这只不在其中。` : "AI 风险笔记未启用。"}</p>`;
  const mini = `<div class="scroll"><table class="mini"><thead><tr><th>到期</th><th>行权价</th><th>Delta</th><th>缓冲 σ</th><th>估成交价</th><th>年化</th><th>OI</th></tr></thead><tbody>
    ${contracts.map((k) => `<tr><td>${k.expiry.slice(5)} · ${k.dte}天${k.crosses_earnings ? ' <span class="tag earn">跨财报</span>' : ""}</td><td>${usd(k.strike, k.strike % 1 ? 1 : 0)}</td><td>${k.delta.toFixed(2)}</td><td>${k.buffer_sd?.toFixed(2) ?? "–"}</td><td>${usd(k.premium)}</td><td>${pct(k.annualized)}</td><td>${k.open_interest}</td></tr>`).join("")}
    </tbody></table></div>`;
  return `<tr class="detail"><td colspan="${COLS.length}"><div class="detail-grid">
    <div>${aiHtml}</div>
    <div><h4>基本面</h4><div class="chips">${chips}</div><h4>可选合约</h4>${mini}</div>
  </div></td></tr>`;
}

$("head").addEventListener("click", (e) => { const k = e.target.dataset.k; if (k) { sortKey = k; render(); } });
$("body").addEventListener("click", (e) => {
  const tr = e.target.closest("tr.row"); if (!tr) return;
  const t = tr.dataset.t; open.has(t) ? open.delete(t) : open.add(t); render();
});
["sector", "risk", "source"].forEach((id) => $(id).addEventListener("change", render));
["hideEarn", ...FILTER_IDS].forEach((id) => $(id).addEventListener("input", () => { saveFilters(); render(); }));
$("reset").addEventListener("click", () => { setFilters(pageDefaults()); saveFilters(); render(); });
$("date").addEventListener("change", (e) => load(e.target.value || null));

(async () => {
  try {
    const dates = await (await fetch("data/history/index.json", { cache: "no-store" })).json();
    $("date").innerHTML = dates.map((d, i) => `<option value="${i ? d : ""}">${d}${i ? "" : "（最新）"}</option>`).join("");
  } catch { $("date").innerHTML = '<option value="">最新</option>'; }
  try {
    await load(null);
    setFilters({ ...pageDefaults(), ...(savedFilters() || {}) });
    render();
  } catch (e) { $("sub").textContent = "数据加载失败：" + e; }
})();
</script>
</body>
</html>
