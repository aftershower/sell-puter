# sell-puter 筛选参数。改完 push 即可，第二天的扫描会用新参数。

[universe]
# S&P 500 自动抓取；这里加上不在 S&P 500 里、你也认可的公司
extra_tickers = ["ASML", "TSM", "ARM", "MELI", "SHOP", "NVO", "SAP", "SONY", "TM", "SPOT"]
# 永远不看的股票
exclude_tickers = []
# 每天把 Reddit 股票版块过去 24 小时提及最多的前 N 只加进股票池（同样要过质地门槛）；0 = 不加
reddit_top_n = 50
# 每天再加上 Yahoo 的榜单：most_actives = 成交最活跃，day_losers = 当日跌幅榜（同样要过质地门槛）
yahoo_screens = ["most_actives", "day_losers"]
yahoo_count = 50
# 这些"代码"在 Reddit 上多半是普通单词或缩写，不算热门
reddit_ignore = [
  "DTE", "IT", "ALL", "ET", "IP", "HR", "PR", "DC", "EU", "VC", "CIA", "YOU", "RR", "TP", "CC", "API", "LINK",
  "AGI", "MAGA", "NYT", "AI", "CEO", "DD", "ATH", "EV", "OP", "ON", "ONE", "NOW", "OPEN", "GO", "SO", "CAN",
  "BE", "AM", "PM", "TV", "UK", "US", "USA", "IRS", "SEC", "FDA", "FOR", "ARE", "BIG", "NEW", "ANY", "IPO",
  "GDP", "CPI", "FED", "ETF", "IMO", "YOLO", "FOMO", "LOVE", "REAL", "BEST", "RUN", "WELL", "HUGE", "FUN",
  "LOT", "OR", "OG", "ZN",
]

[quality]
# S&P 500 成分股和 extra_tickers 直接视为质地合格（进标普本身就要求持续盈利、市值和流动性）。
# 下面的门槛只用于其他来源（Reddit 热门、Yahoo 成交最活跃）。缺失的数据视为通过。
min_market_cap = 10_000_000_000     # 市值 >= 100 亿美元
require_profitable = true           # 净利率 > 0（在盈利）
# 可选的更严格门槛，取消注释即可启用：
# min_roe = 0.10
# min_profit_margin = 0.05
# require_positive_fcf = true
# max_debt_to_equity = 200
# max_drawdown_52w = 0.40
min_price = 20                      # 所有股票：股价 >= $20
require_above_sma200 = false        # 所有股票：是否要求股价在 200 日均线上方
fundamentals_cache_days = 7         # 基本面数据缓存天数

[options]
# 后端抓取范围：只有这个范围内的合约会存下来。页面上的筛选只能在这个范围内收紧，
# 所以这里放得宽一些，日常调整用页面上的输入框（默认值见下面的 [page]）。
min_dte = 7
max_dte = 42
max_expiries_per_ticker = 5
delta_min = 0.15                    # |delta| 下限
delta_max = 0.35                    # |delta| 上限
min_iv = 0.40                       # 隐含波动率下限（0.40 = 40%）
min_annualized = 0.15               # 年化收益 = 估成交价 / 行权价 * 365 / DTE（估成交价 = 中间价 - 1/4 价差）
min_premium = 0.30                  # 每股权利金至少 $0.30
min_open_interest = 100
max_quote_age_days = 5              # 合约最后成交超过 5 天的报价视为过时，不用
max_spread_pct = 0.20               # (ask - bid) / mid
contracts_per_ticker = 12           # 每只股票最多保留几个合约（每个到期日、每 0.05 Delta 区间各留最好的一个）
max_collateral = 40_000             # 一手担保金上限：行权价 × 100
gap_warn = 0.03                     # 盘前涨跌超过 3% 时标红

[page]
# 页面筛选的默认值（页面上可以随时改，改过的值会记在你的浏览器里）。AI 笔记优先分析符合这些条件的股票。
min_iv = 0.60
min_annualized = 0.30
delta_min = 0.20
delta_max = 0.30
max_dte = 42
max_collateral = 40_000
hide_earnings = true

[ai]
enabled = true                      # 没有 ANTHROPIC_API_KEY 时自动跳过
model = "claude-sonnet-5-5"
daily_budget_usd = 1.8              # 早上扫描的 AI 花费上限（按官方单价估算），到了就停；晚上复盘另算
top_n = 30                          # 最多给 N 只写笔记（先挑符合 [page] 默认条件的，再按年化）
deep_n = 15                         # 其中前 N 只做单独深度分析（联网搜索 + 读原文），预算不够时自动减少
deep_effort = "high"
deep_searches = 3                   # 每只深度分析最多搜索次数（$0.01/次）
deep_fetches = 2                    # 每只深度分析最多读几篇原文（新闻、Reddit 帖子）
deep_workers = 2                    # 同时做几只深度分析
effort = "low"                      # 其余股票的批量简要笔记
news_per_ticker = 8                 # Yahoo 和 Google News 各取几条标题

[dream]
# 每个交易日晚上 8 点（美东）复盘：给过往推荐打分，AI 更新自己的经验库（memory/），明早的分析会读到
enabled = true
budget_usd = 0.7                    # 复盘的 AI 花费上限；加上早上的 1.8，每个交易日约 $2.5
effort = "high"
searches = 3                        # 复盘时最多联网搜索几次（查跌破行权价的股票发生了什么）

[run]
workers = 4                         # 并发请求数，太大会被 Yahoo 限流
