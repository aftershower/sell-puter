name: nightly-review

on:
  schedule:
    # Fallback only, like daily.yml: GitHub's scheduled runs come hours late or not at all. Any
    # trigger works: sellputer.dream reviews the latest trading day that has closed, once.
    - cron: "7 22,0,2,4,6,8,10,12 * * *"
  workflow_dispatch:
    inputs:
      auto:
        description: "Automatic run: skip if the latest closed trading day was already reviewed"
        type: boolean
        default: false

concurrency:
  group: sellputer  # shared with daily.yml so the two never push at once
  cancel-in-progress: false

jobs:
  dream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Review and update memory
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SELLPUTER_AUTO: ${{ github.event_name == 'schedule' || inputs.auto == true }}
        run: uv run python -m sellputer.dream

      - name: Commit results
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data memory
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "review $(python3 -c 'import json; print(json.load(open("site/data/dream.json"))["date"])')"
          for i in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            sleep $((i * 10))
          done
          exit 1

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: site
      - id: deploy
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
