name: nightly-review

on:
  schedule:
    # 8pm New York = 00:00 or 01:00 UTC the next day depending on DST. Fire three times since
    # scheduled runs can come late or get dropped; the gate takes 20:00-22:59 New York time and
    # the job skips itself once tonight's review exists.
    - cron: "7 0,1,2 * * 2-6"
  workflow_dispatch:

concurrency:
  group: sellputer  # shared with daily.yml so the two never push at once
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          hour=$((10#$(TZ=America/New_York date +%H)))
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$hour" -lt 20 ] || [ "$hour" -ge 23 ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "NY hour is $hour, skipping"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  dream:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Review and update memory
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m sellputer.dream

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data memory
          git diff --cached --quiet || git commit -m "review $(TZ=America/New_York date +%F)"
          for i in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            sleep $((i * 10))
          done
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
