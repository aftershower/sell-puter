name: daily-scan

on:
  schedule:
    # GitHub cron is UTC with no DST, and scheduled runs come late or get dropped (worst at :00).
    # Fire three times; the gate lets anything landing 9:00-11:59 New York time through, and the
    # scan skips itself once today's results exist.
    - cron: "7 13,14,15 * * 1-5"
  workflow_dispatch:

concurrency:
  group: sellputer  # shared with dream.yml so the two never push at once
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          hour=$((10#$(TZ=America/New_York date +%H)))
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$hour" -lt 9 ] || [ "$hour" -ge 12 ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "NY hour is $hour, skipping"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: cache
          key: sellputer-cache-${{ github.run_id }}
          restore-keys: sellputer-cache-

      - name: Scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m sellputer.main

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "scan $(TZ=America/New_York date +%F)"
          for i in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            sleep $((i * 10))
          done
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
